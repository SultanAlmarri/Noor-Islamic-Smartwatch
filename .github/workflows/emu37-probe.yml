name: Android 17 emulator probe (temporary)

on:
  push:
    branches: [ 'probe/**' ]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: anim-ram4g
            target: google_apis
            ram: 4096M
            opts: -no-window -gpu swiftshader_indirect -no-snapshot -camera-back none
          - name: noanim-ram4g
            target: google_apis
            ram: 4096M
            opts: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          - name: playstore-ram4g
            target: google_apis_playstore
            ram: 4096M
            opts: -no-window -gpu swiftshader_indirect -no-snapshot -camera-back none
          - name: anim-ram4g-gpuguest
            target: google_apis
            ram: 4096M
            opts: -no-window -gpu guest -no-snapshot -camera-back none
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Images available
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --list --channel=0 2>/dev/null | grep -E "system-images;android-3[67]" | head -40 || true
      - run: ./gradlew :app:assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: '37.0'
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: ${{ matrix.ram }}
          disk-size: 8G
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: ${{ matrix.opts }}
          script: |
            adb shell getprop ro.build.version.sdk; adb shell getprop ro.build.version.release
            E2E_LOG=alert-e2e-probe-${{ matrix.name }}.txt bash tools/devicetest/alert_e2e.sh app/build/outputs/apk/debug/app-debug.apk all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.name }}
          path: alert-e2e-probe-*.txt
