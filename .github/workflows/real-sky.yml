name: Real sky on real Android (emulator)

# The real sky: the OpenGL ES 3 renderer on an Android emulator, each scenery photographed through the day.
# See tools/devicetest/real_sky.sh. The pictures are uploaded, and published as a pre-release asset.

on:
  push:
    branches: [ main, 'sky/**' ]
    paths: [ 'app/src/main/assets/sky2/**', 'app/src/main/java/com/noor/app/sky/**', 'tools/devicetest/real_sky.sh', '.github/workflows/real-sky.yml' ]
  workflow_dispatch:
    inputs:
      tier:
        description: Quality tier (LOW, MEDIUM, HIGH, ULTRA)
        default: HIGH
      sceneries:
        description: Sceneries (Scenery names, space separated)
        default: DUNES RAINFOREST ARCTIC SEA SAVANNA CANYON
      times:
        description: Moments (UTC hhmm:name, space separated; Dubai is UTC+4)
        default: 0235:sunrise 0700:midday 1305:golden 1338:sunset 1356:dusk 1900:night

permissions:
  contents: write

jobs:
  sky:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the debug app
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Each scenery through the day
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # A push photographs two moments of two sceneries (the software GPU needs minutes for each); run the
          # workflow by hand for every scenery and the whole day.
          SCENERIES: ${{ inputs.sceneries || 'DUNES RAINFOREST' }}
          TIMES: ${{ inputs.times || '0700:midday 1338:sunset' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: timeout 5400 bash tools/devicetest/real_sky.sh app/build/outputs/apk/debug/app-debug.apk real-sky ${{ inputs.tier || 'HIGH' }} || true

      - name: What the renderer said
        if: always()
        run: cat real-sky/real_sky_log.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-sky
          path: real-sky

      - name: Publish the pictures as a pre-release asset
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d real-sky ] || exit 0
          rm -f real-sky/logcat.txt
          (cd real-sky && zip -qr ../real-sky.zip .)
          gh release view real-sky-preview >/dev/null 2>&1 || gh release create real-sky-preview --prerelease \
            --title "Real sky preview (emulator pictures)" --notes "Pictures from the real-sky workflow; replaced on each run." || true
          gh release upload real-sky-preview real-sky.zip --clobber
