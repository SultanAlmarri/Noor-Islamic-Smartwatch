name: Home sky on real Android (emulator)

# The GPU sky (AGSL shaders compiled and drawn by Android itself) and the Qibla accuracy box with injected sensor
# readings, on Android 14 and 15 emulators. See tools/devicetest/home_sky.sh. Pictures and recordings are uploaded.

on:
  push:
    branches: [ main, 'sky/**' ]
    # Only what the pictures show: the home sky, the Qibla screen and the compass, and this test itself.
    paths: [ 'app/src/main/res/raw/**', 'app/src/main/java/com/noor/app/ui/today/**', 'app/src/main/java/com/noor/app/ui/qibla/**',
             'shared/src/main/java/com/noor/shared/compass/**', 'tools/devicetest/home_sky.sh', '.github/workflows/home-sky.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sky:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [ 34, 35 ]
        gpu: [ swiftshader_indirect ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the debug app
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Home sky through the day, opening, drag, Qibla sensors
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -no-boot-anim -camera-back none
          script: timeout 2700 bash tools/devicetest/home_sky.sh app/build/outputs/apk/debug/app-debug.apk home-sky-api${{ matrix.api }}-${{ matrix.gpu }} || true

      - name: The GPU shaders must have been built
        run: |
          cat home-sky-api${{ matrix.api }}-${{ matrix.gpu }}/sky_log.txt || true
          grep -q "GPU sky shaders built" home-sky-api${{ matrix.api }}-${{ matrix.gpu }}/sky_log.txt
          ! grep -q "Sky shaders unavailable" home-sky-api${{ matrix.api }}-${{ matrix.gpu }}/sky_log.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-sky-api${{ matrix.api }}-${{ matrix.gpu }}
          path: home-sky-api${{ matrix.api }}-${{ matrix.gpu }}

      # Also as a pre-release asset, so the pictures can be fetched where workflow artifacts cannot (a Claude Code
      # cloud session); replaced on each run.
      - name: Publish the pictures as a pre-release asset
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d home-sky-api${{ matrix.api }}-${{ matrix.gpu }} ] || exit 0
          (cd home-sky-api${{ matrix.api }}-${{ matrix.gpu }} && zip -qr ../home-sky-api${{ matrix.api }}-${{ matrix.gpu }}.zip .)
          gh release view home-sky-preview >/dev/null 2>&1 || gh release create home-sky-preview --prerelease \
            --title "Home sky preview (emulator pictures)" --notes "Pictures and recordings from the home-sky workflow; replaced on each run." || true
          gh release upload home-sky-preview home-sky-api${{ matrix.api }}-${{ matrix.gpu }}.zip --clobber
