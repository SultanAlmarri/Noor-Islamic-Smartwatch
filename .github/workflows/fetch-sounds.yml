name: Fetch licensed Adhan recordings

# Downloads the recordings listed in tools/sounds/adhan_sources.json (Wikimedia Commons, NPS sound
# libraries, radio aporee on the Internet Archive, the owner's own files in tools/sounds/owner),
# re-checks each file's licence (Commons) and SHA-1, keeps only the audio (lossless FLAC) and publishes
# the result, with its attribution data, on the "sound-sources" pre-release.
# The app's bundled sounds are produced from these files by tools/sounds/build_library.py.

on:
  push:
    branches: [ main ]
    paths:
      - tools/sounds/adhan_sources.json
      - tools/sounds/fetch_commons.py
      - tools/sounds/owner/**
      - .github/workflows/fetch-sounds.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Fetch and verify
        run: python3 tools/sounds/fetch_commons.py tools/sounds/adhan_sources.json out
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sound-sources
          name: Sound source recordings (Adhans and nature)
          prerelease: true
          body: |
            Audio extracted losslessly from freely licensed recordings (Wikimedia Commons, US National Park
            Service, radio aporee on the Internet Archive, the owner's own recordings), with each file's licence,
            author and SHA-1 in sources.json. These are the inputs to tools/sounds/build_library.py; they are
            not an app build. Licences as listed per file (public domain, CC0, CC BY, CC BY-SA).
          files: |
            out/*.flac
            out/*.wav
            out/*.mp3
            out/*.ogg
            out/*.oga
            out/sources.json
          fail_on_unmatched_files: false
