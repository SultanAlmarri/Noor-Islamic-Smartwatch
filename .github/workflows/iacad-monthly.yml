name: IACAD monthly blind test

on:
  schedule:
    - cron: '17 6 2 * *'   # 2nd of every month, 10:17 Dubai time: one request to IACAD's public feed
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'accuracy/blind/**', '.github/workflows/iacad-monthly.yml' ]

permissions:
  contents: write

jobs:
  fetch-and-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch this month's official IACAD times
        run: python3 accuracy/blind/fetch_iacad_month.py
      - name: Score frozen predictions
        run: python3 accuracy/blind/score.py
      - name: Commit results
        run: |
          git config user.name "noor-accuracy-bot"
          git config user.email "noor-accuracy-bot@users.noreply.github.com"
          git add accuracy/blind
          git diff --cached --quiet || git commit -m "Blind test: IACAD $(date -u +%Y-%m) official month and score"
          git push
