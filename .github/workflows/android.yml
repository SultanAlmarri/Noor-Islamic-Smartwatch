name: Android build and tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Prayer engine tests (accuracy against reference and official IACAD data)
        run: ./gradlew :core:prayer:test --stacktrace

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build installable APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Noor-debug.apk 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk out/Noor-release-test-signed.apk 2>/dev/null || true
          (cd core/prayer/build && zip -qr ../../../out/engine-test-report.zip reports test-results) 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noor-build-${{ github.run_number }}
          path: out/

      - name: Publish rolling development build
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Development build (latest main)
          prerelease: true
          body: |
            Automatic build of `${{ github.sha }}` (run ${{ github.run_number }}).
            Test build, signed with the debug key. Not a store release.
          files: |
            out/Noor-debug.apk
            out/Noor-release-test-signed.apk
            out/engine-test-report.zip
