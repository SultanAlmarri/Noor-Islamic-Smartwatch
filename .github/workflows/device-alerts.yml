name: Adhan on real Android (emulator)

# The alert path on a real Android system, not a simulation: a real alarm fires while Noor's process is dead, the
# screen is off and the device is in Doze; Android must report the Adhan playing on the alarm stream (see
# tools/devicetest/alert_e2e.sh). Emulators have no speaker and no phone maker's battery manager, so this does not
# replace a test on a real phone; it proves the Android side works on stock Android 14 and 15.

on:
  push:
    branches: [ main ]
    paths: [ 'alerts/**', 'app/**', 'core/**', 'tools/devicetest/**', '.github/workflows/device-alerts.yml' ]
  workflow_dispatch:

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [ 34, 35 ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the debug app (it carries the test hook; release builds do not)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Alarm → Adhan with Noor closed, screen off, Doze (normal, vibrate, no exact alarms)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: E2E_LOG=alert-e2e-api${{ matrix.api }}.txt bash tools/devicetest/alert_e2e.sh app/build/outputs/apk/debug/app-debug.apk all

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alert-e2e-api${{ matrix.api }}
          path: alert-e2e-api${{ matrix.api }}.txt
