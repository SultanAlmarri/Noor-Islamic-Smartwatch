name: Adhan on real Android (emulator)

# The alert path on a real Android system, not a simulation: a real alarm fires while Noor's process is dead, the
# screen is off and the device is in Doze; Android must report the Adhan playing on the alarm stream (see
# tools/devicetest/alert_e2e.sh). Emulators have no speaker and no phone maker's battery manager, so this does not
# replace a test on a real phone; it proves the Android side works on stock Android 14, 15 and 17.

on:
  push:
    branches: [ main, 'adhan/**' ]
    paths: [ 'alerts/**', 'app/**', 'core/**', 'tools/devicetest/**', '.github/workflows/device-alerts.yml' ]
  workflow_dispatch:

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Android 14, 15 and 17. Android 17's system image is "37.0" (its SDK platform is installed as 36), with its
        # background-audio hardening; the scheduled scenarios also run there at its strictest.
        include:
          - api: 34
            image: '34'
          - api: 35
            image: '35'
          - api: 36
            image: '37.0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the debug app (it carries the test hook; release builds do not)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Alarm → Adhan with Noor closed, screen off, Doze (normal, vibrate, no exact alarms, real scheduled prayer alarm)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.image }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Android 17's image does not finish starting with the default 2 GB.
          ram-size: 4096M
          disk-size: 8G
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: E2E_LOG=alert-e2e-api${{ matrix.image }}.txt bash tools/devicetest/alert_e2e.sh app/build/outputs/apk/debug/app-debug.apk all

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alert-e2e-api${{ matrix.image }}
          path: alert-e2e-api${{ matrix.image }}.txt
